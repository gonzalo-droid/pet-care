name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (compila y pruebas comunes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Compilar APK de debug
        run: ./gradlew :androidApp:assembleDebug
      - name: Pruebas (JVM y host de Android)
        run: ./gradlew allTests
      - uses: actions/upload-artifact@v4
        with:
          name: bestid-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  android-avisos:
    name: Android (avisos en emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Compilar APK de debug
        run: ./gradlew :androidApp:assembleDebug
      - name: Liberar espacio en el runner (el emulador necesita disco para sus datos)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Avisos con la app cerrada y tras reiniciar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: .github/scripts/android-reminders-e2e.sh build/android-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-avisos-capturas
          path: build/android-e2e/
          if-no-files-found: warn

  ios:
    name: iOS (compila y pruebas comunes)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Pruebas en el simulador iOS (comunes y flujo de UI de M1)
        run: ./gradlew iosSimulatorArm64Test
      - name: Compilar la app para el simulador
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Abrir la app en el simulador
        run: .github/scripts/ios-smoke.sh build/ios-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-capturas
          path: |
            composeApp/build/ui-screenshots/
            build/ios-smoke/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-reportes-de-pruebas
          path: '**/build/reports/tests/'
