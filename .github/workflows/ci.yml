name: CI

# Solo en PRs que tocan código de la app, o a mano desde la pestaña Actions.
# No corre en cada push: así no se gastan minutos en commits intermedios ni en cambios de docs.
on:
  pull_request:
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# Un solo build por PR: un push nuevo cancela el que estaba corriendo.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (compila y pruebas comunes)
    # Linux: cuenta 1x en la cuota (macOS cuenta 10x). Las pruebas de lógica no necesitan Xcode.
    runs-on: ubuntu-latest
    # Tope por si algo se cuelga: una ejecución normal toma ~6 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Compilar APK de debug y correr las pruebas (JVM y host de Android)
        run: ./gradlew :androidApp:assembleDebug allTests
      - uses: actions/upload-artifact@v4
        with:
          name: bestid-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          # El almacenamiento de artefactos también cuenta en repos privados.
          retention-days: 3
